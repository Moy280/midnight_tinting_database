# Cloudflare Pages project config.
# Replace database_id with the ID that `wrangler d1 create midnight-bookings` prints.
name = 'midnight-window-tinting'
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "midnight-bookings"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
